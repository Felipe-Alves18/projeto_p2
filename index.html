<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Produtos</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="catalogo">
        <!-- Logo menor e centralizada -->
        <img src="assets/images/logo.jpg.jpeg" alt="Logo da loja" width="100">

        <h1>Catálogo de Produtos - Loja Online</h1>

        <p>Camisa Básica Premium.</p>

        <ul>
            <li>Camisa Básica Premium</li>
        </ul>

        <table>
            <tr>
                <th>Produto</th>
                <th>Preço</th>
            </tr>
            <tr>
                <td>Camisa Básica Premium</td>
                <td>R$ 49,90</td>
            </tr>
        </table>

        <!-- VÍDEO LOCAL -->
        <div class="video-box">
            <h2>Apresentação do Produto</h2>
            <video width="320" height="240" controls preload="auto">
                <source src="assets/videos/vd_camisas3.mp4" type="video/mp4">
                Seu navegador não suporta a tag de vídeo ou o arquivo não foi encontrado.
            </video>
        </div>

        <p><a href="#">Visite nosso site completo</a></p>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
